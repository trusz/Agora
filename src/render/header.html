{{define "header.html"}}
<nav id="main-nav">
	<a href="/">
		<h1>Agora <small>⍺</small></h1>

	</a>
	<ul class="nav-links">
		<li><a href="/posts/">Posts</a></li>
		<li><a href="/posts/submit">Submit Post</a></li>
		<!-- <li><a href="/settings">Settings</a></li> -->
		<!-- <li><a href="/about">About</a></li> -->
	</ul>
	<form action="/search" method="get" class="nav-search">
		<input type="text" name="q" placeholder="Search…">
		<button type="submit">Search</button>
	</form>
	<avatar>{{ .User.Name }}</avatar>
</nav>
<style>
	#main-nav {
		display: grid;
		grid-template-columns: 1fr auto auto auto;
		align-items: center;
		/* display: flex; */
		/* justify-content: space-between; */

		font-weight: bold;
		background-color: none;
		margin: 0;

		a {
			width: max-content;
		}

		h1 {
			font-weight: 250;
			align-self: flex-start;
		}


		ul {
			list-style: none;
			padding: 0;
		}

		ul li {
			display: inline-block;
			margin: 0 0.5rem;
			position: relative;
			text-align: left;
		}

		avatar {
			padding: 0 1rem;
			background-color: #E9EBEF;
			border: 1px thin #D1D3D7;
			height: 2rem;
			display: inline-flex;
			align-items: center;
			margin-left: 0.5rem;
		}

		.nav-search {
			display: flex;
			gap: 0.25rem;
			align-items: center;
			margin: 0;
			padding: 0;

			input[type="text"],
			button {
				height: 2rem;
				padding: 0 0.5rem;
				border: 1px solid var(--gray-3);
				font-size: 0.9rem;
				box-sizing: border-box;
				line-height: 1;
				margin: 0;
			}

			button {
				padding: 0 0.6rem;
				border: none;
			}
		}
	}
</style>
{{end}}
