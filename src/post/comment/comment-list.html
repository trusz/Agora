{{ define "comment-list.html" }}
{{ .Data.Post.NumberOFComments }} Comments
<ul id="comment-list">
	{{ range .Data.Comments }}
	<li id="comment-{{ .ID }}">
		<small>{{ .UserName }} · {{ .CreatedAt }}</small>

		{{ if .CanEdit }}
		<form action="/posts/{{ $.Data.Post.ID }}/comment/{{ .ID }}/edit" method="post" class="comment-edit-form">
			<input type="checkbox" id="comment-edit-{{ .ID }}" class="comment-edit-toggle hidden" />
			<comment-text>
				<text class="view-mode">{{ .Text }}</text>
				<textarea class="edit-mode" name="text" rows="3">{{ .Text }}</textarea>
			</comment-text>
			<comment-actions>
				<label for="comment-edit-{{ .ID }}" class="view-mode">
					<span class="btn small">Edit</span>
				</label>
				<label for="comment-edit-{{ .ID }}" class="edit-mode">
					<span class="btn small secondary">Cancel</span>
				</label>
				<button type="submit" class="edit-mode btn small primary">Save</button>
			</comment-actions>
		</form>
		{{ else }}
		<text>{{ .Text }}</text>
		{{ end }}
	</li>
	{{ else }}
	<span>No comments yet. Be the first!</span>
	{{ end }}
</ul>
<style>
	#comment-list {
		list-style-type: none;
		padding: 0;
		display: grid;
		gap: 0.75rem;

		li {
			padding: 0.5rem;
		}

		text {
			white-space: pre-wrap;
			display: block;
		}

		.comment-edit-form {
			display: contents;
		}

		comment-text {
			display: block;
			margin: 0.25rem 0;

			textarea {
				width: 100%;
				box-sizing: border-box;
				font-size: 1rem;
				padding: 0.4rem;
			}
		}

		comment-actions {
			display: flex;
			gap: 0.5rem;
			align-items: center;
			margin-top: 0.25rem;
		}

		.hidden { display: none; }
		.edit-mode { display: none !important; }

		.comment-edit-toggle:checked ~ comment-text .edit-mode,
		.comment-edit-toggle:checked ~ comment-actions .edit-mode {
			display: unset !important;
		}
		.comment-edit-toggle:checked ~ comment-text .view-mode,
		.comment-edit-toggle:checked ~ comment-actions .view-mode {
			display: none !important;
		}

		.btn {
			display: inline-block;
			padding: 0.2rem 0.6rem;
			font-size: 0.8rem;
			cursor: pointer;
			border: 1px solid var(--gray-3);
			background: var(--gray-1);
			font-weight: bold;
		}
		.btn.primary {
			background: var(--foreground);
			color: var(--background);
			border-color: var(--foreground);
		}
		.btn.secondary { background: none; }
	}
</style>

{{end}}
